syntax = "proto3";

package minekin.v1;

import "minekin/v1/control.proto";
import "minekin/v1/session.proto";

option java_multiple_files = true;
option java_outer_classname = "ObservationProto";
option java_package = "io.minekin.protocol.v1";

enum ConnectionPhase {
  CONNECTION_PHASE_UNSPECIFIED = 0;
  CONNECTION_PHASE_RESOLVING = 1;
  CONNECTION_PHASE_LOGIN_NEGOTIATING = 2;
  CONNECTION_PHASE_PLAY_INIT = 3;
  CONNECTION_PHASE_JOIN_SEEN = 4;
  CONNECTION_PHASE_PLAYABLE = 5;
  CONNECTION_PHASE_DISCONNECTED = 6;
  CONNECTION_PHASE_FAILED = 7;
  CONNECTION_PHASE_CANCELLED = 8;
}

enum AdmissionFailureReason {
  ADMISSION_FAILURE_REASON_UNSPECIFIED = 0;
  ADMISSION_FAILURE_REASON_ADDRESS_INVALID = 1;
  ADMISSION_FAILURE_REASON_DNS_FAILED = 2;
  ADMISSION_FAILURE_REASON_ADDRESS_POLICY_BLOCKED = 3;
  ADMISSION_FAILURE_REASON_CONNECT_TIMEOUT = 4;
  ADMISSION_FAILURE_REASON_PROTOCOL_MISMATCH = 5;
  ADMISSION_FAILURE_REASON_AUTH_MODE_MISMATCH = 6;
  ADMISSION_FAILURE_REASON_WHITELIST_REJECTED = 7;
  ADMISSION_FAILURE_REASON_DUPLICATE_LOGIN = 8;
  ADMISSION_FAILURE_REASON_RESOURCE_PACK_BLOCKED = 9;
  ADMISSION_FAILURE_REASON_FIRST_SNAPSHOT_TIMEOUT = 10;
  ADMISSION_FAILURE_REASON_WORLD_BINDING_MISMATCH = 11;
  ADMISSION_FAILURE_REASON_UNEXPECTED_DISCONNECT = 12;
  ADMISSION_FAILURE_REASON_CONTROL_LOST = 13;
  ADMISSION_FAILURE_REASON_CANCELLED = 14;
  ADMISSION_FAILURE_REASON_INTERNAL_INVARIANT = 15;
  // A connection that was attempted and refused: the address resolved, the policy
  // allowed it, and nothing was listening on the other end. Its own value rather
  // than `ADDRESS_INVALID`, which belongs to the admission contract's parse/resolve
  // stage and means no connection was created at all — a refusal is proof that one
  // was, and that is what the client's own log says ("Connection refused"). A
  // reason code that files a refusal under resolve tells a reader of the ledger
  // something about the world that nobody observed.
  ADMISSION_FAILURE_REASON_CONNECTION_REFUSED = 16;
}

// Server-supplied text is deliberately absent. The Bridge maps it to a stable
// reason and may keep redacted diagnostics outside the product event payload.
enum HostPhase {
  HOST_PHASE_UNSPECIFIED = 0;
  HOST_PHASE_LAN_OPENED = 1;
  HOST_PHASE_LAN_OPEN_FAILED = 2;
}

// What happened to a world the Kin is hosting, reported by the Bridge. The contract's
// event set has one failure and puts the reason in the Bridge's local log, so this
// carries the outcome and never the client's own words for it.
message HostLifecycle {
  string request_id = 1;
  uint64 generation = 2;
  HostPhase phase = 3;
  // The port the world is reachable on, and zero when it is not published. Zero is
  // never an address: a reader that joins it would be joining nothing, which is why
  // the publication rule on the Bridge side refuses to report one.
  uint32 bound_port = 4;
}

message ConnectionLifecycle {
  uint64 generation = 1;
  string server_profile_id = 2;
  string server_profile_revision = 3;
  ConnectionPhase phase = 4;
  AdmissionFailureReason failure_reason = 5;
  bool terminal = 6;
  // Which resource-pack policy this generation's connection was actually created
  // with, named by the Bridge and not by the command it was given: the value is
  // read back off the server record handed to the vanilla connect path. A report
  // that leaves it UNSPECIFIED says nothing, so an older Bridge cannot invent a
  // fact, and a build that ignores the policy it was asked for reports the value
  // it applied instead of hiding it.
  ResourcePackPolicy applied_resource_pack_policy = 7;
}

// The Bridge's own cost on the client thread over one window.
//
// The prototype contract asks for callback wall time and its P50/P95/P99, and the
// same contract forbids the IPC path from stalling the client thread — so the
// measurement has to be taken where the callback runs and reported from where the
// channel is. This is the wire between those two.
//
// It is timing of the Bridge's own work and not of the world, which is what the
// reading side's class table says about it: `MANAGEMENT_ONLY`, inadmissible to the
// Kin's own model of the world. Knowing how long a callback took is knowing about
// the machinery.
//
// Both fields below are bounded. `micros` can never hold more than the series'
// capacity, which is a constant of the build, so a window's encoded size is bounded
// by construction and no run can grow it.
message CallbackBudgetWindow {
  // Which series this is: the Bridge's own callback body, or the client's tick
  // period — the time from one tick to the next, which is where a stall of any
  // origin shows up. Closed on the reading side: a label this build cannot name is
  // a report it counts rather than believes.
  string label = 1;
  // 1-based, and taken when the window closes rather than when it is published. A
  // reader holding windows 1, 2 and 4 can therefore see that 3 existed and did not
  // arrive; a counter travelling in a later message would be a second place for one
  // fact, and would be lost entirely if the run ended first.
  uint64 window = 2;
  // The Bridge's own clock when the window opened. Comparable with the other windows
  // of the same run and with nothing else, the same rule every deadline on this wire
  // already lives under.
  uint64 opened_at_nanos = 3;
  // How many samples arrived in this window. When it is larger than the retained
  // list below, the series outran the memory reserved for it — which a reader can
  // see rather than infer, and which is not the same as a quiet window.
  uint64 recorded = 4;
  // The retained samples in record order, in microseconds. Microseconds because a
  // callback budget is measured in them and a nanosecond count would spend four
  // bytes of every sample on precision no reader of this asks for.
  repeated uint32 micros = 5;
  reserved 6 to 10;
}

// Where the client's own player is and what it is holding.
//
// The added fields are optional rather than defaulted, because "the Bridge did not
// read this" and "the value is zero" are different facts and only one of them is
// ordinary. A yaw of 0.0 read off the client is the player facing south; a yaw of
// 0.0 invented because the read never happened would be a direction nobody observed.
message SelfState {
  float health = 1;
  float max_health = 2;
  int32 food = 3;
  float saturation = 4;
  bool on_ground = 5;
  bool alive = 6;
  string current_screen = 7;
  optional double x = 8;
  optional double y = 9;
  optional double z = 10;
  // The client's own look angles, in its own units: yaw is -180..180 around the
  // vertical axis, pitch is -90 (up) to 90 (down).
  optional float yaw_degrees = 11;
  optional float pitch_degrees = 12;
  // 0-based hotbar index of the stack in hand, and absent when nothing in the hotbar
  // is held — an empty hand is a real state and is reported by `main_hand_item_id`
  // being absent, not by this being zero.
  optional uint32 selected_slot = 13;
  optional string main_hand_item_id = 14;
}

message InventoryStack {
  uint32 slot = 1;
  string item_id = 2;
  uint32 count = 3;
  uint32 damage = 4;
}

message InventorySummary {
  uint64 revision = 1;
  repeated InventoryStack stacks = 2;
}

message VisibleEntity {
  string observation_id = 1;
  string entity_type = 2;
  float relative_x = 3;
  float relative_y = 4;
  float relative_z = 5;
  bool line_of_sight = 6;
  // Only for a dropped item the client can see: what it is and how many. A player
  // picks up an item stack they can identify, so the pair is admitted for entities
  // the client renders as items and for nothing else — an entity's hidden inventory
  // is not part of what looking at it shows.
  //
  // There is deliberately no world position here. `relative_*` is measured from the
  // observer, which is what a client sees, while a world coordinate would locate
  // every entity the renderer holds against server truth — including the ones nobody
  // is looking at. Navigation uses the observer's own position from `SelfState`.
  optional string item_id = 7;
  optional uint32 item_count = 8;
}

message InitialObservation {
  uint64 generation = 1;
  uint64 game_tick = 2;
  SelfState self = 3;
  InventorySummary inventory = 4;
  repeated VisibleEntity visible_entities = 5;
  bool authoritative = 6;
  SessionIdentityReport session_identity = 7;
  reserved 8 to 10;
}

// What the client's crosshair is on, read on the client thread at a named tick.
//
// `MISS` is a positive statement — the read happened and hit nothing — and is not
// the same as `UNSPECIFIED`, which means no read was reported. The distinction is
// the whole of "did the client look and see nothing" versus "the Bridge never
// looked", and a plan that treats them alike would break a block it never saw.
//
// Only the branch `kind` selects is filled. There are no fields for a block behind
// the crosshair, for a neighbour of the hit block, or for anything the ray did not
// reach: the observation surface is the ray, not the loaded chunk.
enum AimTargetKind {
  AIM_TARGET_KIND_UNSPECIFIED = 0;
  AIM_TARGET_KIND_MISS = 1;
  AIM_TARGET_KIND_BLOCK = 2;
  AIM_TARGET_KIND_ENTITY = 3;
}

message AimTarget {
  uint64 game_tick = 1;
  AimTargetKind kind = 2;
  // Set when `kind` is BLOCK. The face is the one the client's own hit result
  // carries, which is what a placement or a break is resolved against.
  BlockTarget block = 3;
  // What the client is rendering under the crosshair, as the game names the block
  // (`minecraft:oak_log`). Recognising the block in front of you is something a
  // player does by looking at it — vanilla's own debug overlay shows exactly this for
  // the targeted block — so it is the ceiling of what the ray may say, and not a
  // licence to ask about a block the ray missed. The name of the field is the
  // targeting, not the block's internal state: no property list and no neighbours.
  string targeted_block_id = 4;
  // Set when `kind` is ENTITY, using the same `observation_id` vocabulary
  // `VisibleEntity` publishes, so a target and the entity list agree with each other.
  string entity_observation_id = 5;
  string entity_type = 6;
  // From the client's eyes to the hit point, in blocks, as the client's own hit
  // result reports it. Absent when there is no hit to measure.
  optional double distance = 7;
}

// The client's own break animation for the block it is currently hitting. This is
// the player-visible progress bar, not a estimate of remaining ticks, so the reader
// can see a break stall (wrong tool, target lost, other player) without guessing.
message MiningProgress {
  uint64 game_tick = 1;
  BlockTarget target = 2;
  float progress = 3;
}

// The screen the client has open, and the handler id its clicks have to match.
// `sync_id` is absent when no screen is open, because syncId 0 is a real handler
// (the player's own inventory) and cannot double as "there is none".
message GuiScreen {
  string screen_id = 1;
  optional uint32 sync_id = 2;
}

// The recurring player-equivalent view: where the Kin is, what its crosshair is on,
// what it carries, what it can see, and what is open.
//
// `InitialObservation` is the once-at-join admission proof and cannot carry the
// read an action has to be checked against, so this is a second type rather than a
// second use of the first. Everything in it is a re-read of the same client state
// the first snapshot was built from, at the tick named here.
//
// The Bridge publishes it on a fixed tick interval while a Core session holds the
// world-observation capability, so its cost is bounded by a constant of the build
// and not by how often somebody asks.
message WorldObservation {
  uint64 generation = 1;
  uint64 game_tick = 2;
  SelfState self = 3;
  AimTarget aim = 4;
  InventorySummary inventory = 5;
  repeated VisibleEntity visible_entities = 6;
  optional MiningProgress mining = 7;
  GuiScreen gui = 8;
  reserved 9 to 12;
}
