syntax = "proto3";

package minekin.v1;

option java_multiple_files = true;
option java_outer_classname = "ControlProto";
option java_package = "io.minekin.protocol.v1";

enum ResourcePackPolicy {
  RESOURCE_PACK_POLICY_UNSPECIFIED = 0;
  RESOURCE_PACK_POLICY_DENY = 1;
  RESOURCE_PACK_POLICY_PROMPT = 2;
}

// Core may send this only after Bridge handshake and capability negotiation.
// The Bridge must still apply its own address policy before invoking the normal
// Minecraft client connection path on the client thread.
message ConnectWorld {
  string request_id = 1;
  uint64 generation = 2;
  string server_profile_id = 3;
  string server_profile_revision = 4;
  string original_host = 5;
  uint32 port = 6;
  ResourcePackPolicy resource_pack_policy = 7;
  uint64 deadline_monotonic_ns = 8;
}

enum ConnectionCancelReason {
  CONNECTION_CANCEL_REASON_UNSPECIFIED = 0;
  CONNECTION_CANCEL_REASON_OPERATOR = 1;
  CONNECTION_CANCEL_REASON_TIMEOUT = 2;
  CONNECTION_CANCEL_REASON_NEW_GENERATION = 3;
  CONNECTION_CANCEL_REASON_SESSION_STOPPING = 4;
}

message CancelConnection {
  string request_id = 1;
  uint64 generation = 2;
  ConnectionCancelReason reason = 3;
}

enum InputPriority {
  INPUT_PRIORITY_UNSPECIFIED = 0;
  INPUT_PRIORITY_NORMAL = 1;
  INPUT_PRIORITY_URGENT = 2;
  INPUT_PRIORITY_EMERGENCY = 3;
}

message InputLease {
  string lease_id = 1;
  uint64 generation = 2;
  string client_instance_id = 3;
  uint64 issued_monotonic_ns = 4;
  uint64 deadline_monotonic_ns = 5;
  InputPriority priority = 6;
  repeated string capabilities = 7;
}

message LookInput {
  string action_id = 1;
  string lease_id = 2;
  uint64 generation = 3;
  float delta_yaw_degrees = 4;
  float delta_pitch_degrees = 5;
  uint64 deadline_monotonic_ns = 6;
}

message MoveInput {
  string action_id = 1;
  string lease_id = 2;
  uint64 generation = 3;
  float forward = 4;
  float strafe = 5;
  bool jump = 6;
  bool sneak = 7;
  uint64 deadline_monotonic_ns = 8;
}

// The use key, held or let go for the length of the lease.
//
// It is the same shape as a movement command on purpose: a player who is using
// something is a player holding a key, so the state to carry is held and the way
// it ends is the lease being withdrawn — the same single release path, which is
// what makes "no key is left down" one rule rather than one per key.
message UseInput {
  string action_id = 1;
  string lease_id = 2;
  uint64 generation = 3;
  bool use = 4;
  uint64 deadline_monotonic_ns = 5;
}

message ReleaseAllInputs {
  string action_id = 1;
  uint64 generation = 2;
  string reason_code = 3;
}

enum ActionStatus {
  ACTION_STATUS_UNSPECIFIED = 0;
  ACTION_STATUS_ACCEPTED = 1;
  ACTION_STATUS_STARTED = 2;
  ACTION_STATUS_SUCCEEDED = 3;
  ACTION_STATUS_FAILED = 4;
  ACTION_STATUS_CANCELLED = 5;
  ACTION_STATUS_UNKNOWN_AFTER_DISCONNECT = 6;
}

message ActionResult {
  string action_id = 1;
  uint64 generation = 2;
  ActionStatus status = 3;
  string reason_code = 4;
  string evidence_ref = 5;
}

// Core may send this only after handshake and capability negotiation, and only to a
// client that is in a world it hosts.
//
// There is deliberately no field for cheats and none for the game mode. Publishing a
// world grants both — measured against 1.21.4, the client's own call raises the host
// player's permission level and allows commands — while the host policy says neither
// may be raised by a command. The strongest form of that rule is a field that does
// not exist, rather than a value the Bridge is expected to refuse.
message OpenLan {
  string request_id = 1;
  uint64 generation = 2;
  // The port to ask for, or zero to let the operating system choose one.
  //
  // The answer carries the port that was actually bound, because this one is not it:
  // the client's own `Started serving on {}` line and its `getServerPort()` both
  // report the value that was requested, so asking for zero makes both say zero while
  // the world listens somewhere else.
  uint32 port = 3;
  uint64 deadline_monotonic_ns = 4;
}

// S2: the block face the client's own crosshair reports, named from the client's
// `Direction`. `UNKNOWN` is what the client says when the hit carries no face
// (a miss against a block it cannot resolve), and is deliberately not the same
// value as "the Bridge never read its crosshair" — which is the absence of the
// whole target record rather than a face of zero.
enum BlockFace {
  BLOCK_FACE_UNSPECIFIED = 0;
  BLOCK_FACE_UNKNOWN = 1;
  BLOCK_FACE_DOWN = 2;
  BLOCK_FACE_UP = 3;
  BLOCK_FACE_NORTH = 4;
  BLOCK_FACE_SOUTH = 5;
  BLOCK_FACE_WEST = 6;
  BLOCK_FACE_EAST = 7;
}

// One block, with the face the client means. Position only, and never a neighbour
// searched around it: the contract allows a Kin to act on the block its crosshair
// is on, so the target it names has to be that one.
message BlockTarget {
  sint32 x = 1;
  sint32 y = 2;
  sint32 z = 3;
  BlockFace face = 4;
}

// Turn the view to an absolute angle. Absolute rather than another delta because
// the reader has to be able to tell an unfinished turn from a finished one, and
// the only way it can is by comparing the angle it asked for with the angle the
// next observation reports. The Bridge clamps how far one command may move the
// view, so "turn to face the thing behind me" is a sequence of observable steps
// and not one 180-degree snap.
message AimInput {
  string action_id = 1;
  string lease_id = 2;
  uint64 generation = 3;
  float yaw_degrees = 4;
  // -90 is straight up, 90 straight down, in the client's own units.
  float pitch_degrees = 5;
  uint64 deadline_monotonic_ns = 6;
}

// The attack key, held or let go — the same shape as `UseInput` for the same
// reason: a player who is mining is a player holding a key down, and the way that
// ends is the lease being withdrawn, not a second release path.
//
// The Bridge does the holding: once `mining` is true it keeps the break going on
// the client thread at the client's own pace, which is what makes the mining
// duration the vanilla one. A message per tick would be a second clock.
//
// `target` is checked and not believed. When the crosshair is not on that block
// the Bridge refuses by name instead of breaking whatever is in front of it, so a
// plan that has gone stale cannot hit an unintended block.
message MineInput {
  string action_id = 1;
  string lease_id = 2;
  uint64 generation = 3;
  bool mining = 4;
  BlockTarget target = 5;
  uint64 deadline_monotonic_ns = 6;
}

// Put one of the nine hotbar slots in hand. Refused outside 0..8: this is the
// hotbar and not the whole inventory, so a Kin that wants something else has to
// move it into the hotbar the way a player does.
message HotbarSelectInput {
  string action_id = 1;
  string lease_id = 2;
  uint64 generation = 3;
  uint32 slot = 4;
  uint64 deadline_monotonic_ns = 5;
}

enum ScreenControl {
  SCREEN_CONTROL_UNSPECIFIED = 0;
  // The player's own inventory and its 2x2 crafting grid. There is no value here
  // for "open the block in front of me": that is what the use key already does, and
  // a second door to the same screen would be a second place to skip the check.
  SCREEN_CONTROL_OPEN_INVENTORY = 1;
  SCREEN_CONTROL_CLOSE = 2;
}

message ScreenInput {
  string action_id = 1;
  string lease_id = 2;
  uint64 generation = 3;
  ScreenControl control = 4;
  uint64 deadline_monotonic_ns = 5;
}

enum SlotClickMode {
  SLOT_CLICK_MODE_UNSPECIFIED = 0;
  SLOT_CLICK_MODE_PICK = 1;
  SLOT_CLICK_MODE_QUICK_MOVE = 2;
  SLOT_CLICK_MODE_SWAP = 3;
  SLOT_CLICK_MODE_THROW = 4;
}

// A click inside the screen the client already has open.
//
// `sync_id` is required and must equal the handler the client reports right now,
// because the contract forbids carrying a stale syncId into the next container.
// The Bridge answers a mismatch with a named refusal rather than sending the
// packet, so a plan written against a closed window cannot land on whatever the
// player opened afterwards.
//
// There is no creative-stroke path here. The one client method that hands an item
// to the player without a transaction (`clickCreativeStack`) is absent by
// construction rather than refused at runtime.
message GuiSlotClick {
  uint32 slot_id = 1;
  uint32 button = 2;
  SlotClickMode mode = 3;
}

// `recipe_id` is the namespaced id of a rule this game version actually has. The
// client resolves it and the server validates it; neither side is asked to believe
// a recipe name the Kin invented.
message GuiRecipeClick {
  string recipe_id = 1;
  bool craft_all = 2;
}

message GuiClickInput {
  string action_id = 1;
  string lease_id = 2;
  uint64 generation = 3;
  uint32 sync_id = 4;
  oneof click {
    GuiSlotClick slot = 5;
    GuiRecipeClick recipe = 6;
    GuiButtonClick button = 8;
  }
  uint64 deadline_monotonic_ns = 7;
}

// A click on a named button of the open screen, by the id the screen assigns it --
// the same vanilla button-click packet a hand would send. Merchants select an offer
// this way before the result slot can pay it out; the id is validated by the client
// against the screen it actually has open.
message GuiButtonClick {
  uint32 button_id = 1;
}

// The currently visible, enabled vanilla respawn button. No game-mode change,
// server command or replay: the client rechecks its death screen on execution.
message RespawnInput {
  string action_id = 1;
  string lease_id = 2;
  uint64 generation = 3;
  uint64 deadline_monotonic_ns = 4;
}

// One chat line the Kin chose to say, sent through the client's own chat path
// (the same call the keyboard's send makes) -- never a command, because a
// leading "/" would be the client executing something rather than speaking.
//
// The words are the Kin's: theirs to mean, so the Bridge refuses an over-long
// line by name instead of clipping it (unlike a *heard* line, which arrives
// clipped as a best-effort memory of what someone else said -- the asymmetry
// is deliberate: the listener preserves, the speaker must mean its words).
// The bound is 256 characters, the same cap the observation side carries; an
// empty or blank line is not speech and is refused too. The send gives no
// server acknowledgement -- what this message can be confirmed by is the
// client accepting the line, and nothing stronger is ever claimed.
message SayInput {
  string action_id = 1;
  string lease_id = 2;
  uint64 generation = 3;
  uint64 deadline_monotonic_ns = 4;
  string text = 5;
}
