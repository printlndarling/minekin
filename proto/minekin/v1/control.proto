syntax = "proto3";

package minekin.v1;

option java_multiple_files = true;
option java_outer_classname = "ControlProto";
option java_package = "io.minekin.protocol.v1";

enum ResourcePackPolicy {
  RESOURCE_PACK_POLICY_UNSPECIFIED = 0;
  RESOURCE_PACK_POLICY_DENY = 1;
  RESOURCE_PACK_POLICY_PROMPT = 2;
}

// Core may send this only after Bridge handshake and capability negotiation.
// The Bridge must still apply its own address policy before invoking the normal
// Minecraft client connection path on the client thread.
message ConnectWorld {
  string request_id = 1;
  uint64 generation = 2;
  string server_profile_id = 3;
  string server_profile_revision = 4;
  string original_host = 5;
  uint32 port = 6;
  ResourcePackPolicy resource_pack_policy = 7;
  uint64 deadline_monotonic_ns = 8;
}

enum ConnectionCancelReason {
  CONNECTION_CANCEL_REASON_UNSPECIFIED = 0;
  CONNECTION_CANCEL_REASON_OPERATOR = 1;
  CONNECTION_CANCEL_REASON_TIMEOUT = 2;
  CONNECTION_CANCEL_REASON_NEW_GENERATION = 3;
  CONNECTION_CANCEL_REASON_SESSION_STOPPING = 4;
}

message CancelConnection {
  string request_id = 1;
  uint64 generation = 2;
  ConnectionCancelReason reason = 3;
}

enum InputPriority {
  INPUT_PRIORITY_UNSPECIFIED = 0;
  INPUT_PRIORITY_NORMAL = 1;
  INPUT_PRIORITY_URGENT = 2;
  INPUT_PRIORITY_EMERGENCY = 3;
}

message InputLease {
  string lease_id = 1;
  uint64 generation = 2;
  string client_instance_id = 3;
  uint64 issued_monotonic_ns = 4;
  uint64 deadline_monotonic_ns = 5;
  InputPriority priority = 6;
  repeated string capabilities = 7;
}

message LookInput {
  string action_id = 1;
  string lease_id = 2;
  uint64 generation = 3;
  float delta_yaw_degrees = 4;
  float delta_pitch_degrees = 5;
  uint64 deadline_monotonic_ns = 6;
}

message MoveInput {
  string action_id = 1;
  string lease_id = 2;
  uint64 generation = 3;
  float forward = 4;
  float strafe = 5;
  bool jump = 6;
  bool sneak = 7;
  uint64 deadline_monotonic_ns = 8;
}

message ReleaseAllInputs {
  string action_id = 1;
  uint64 generation = 2;
  string reason_code = 3;
}

enum ActionStatus {
  ACTION_STATUS_UNSPECIFIED = 0;
  ACTION_STATUS_ACCEPTED = 1;
  ACTION_STATUS_STARTED = 2;
  ACTION_STATUS_SUCCEEDED = 3;
  ACTION_STATUS_FAILED = 4;
  ACTION_STATUS_CANCELLED = 5;
  ACTION_STATUS_UNKNOWN_AFTER_DISCONNECT = 6;
}

message ActionResult {
  string action_id = 1;
  uint64 generation = 2;
  ActionStatus status = 3;
  string reason_code = 4;
  string evidence_ref = 5;
}
