[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "minekin-core"
version = "0.0.0"
description = "P0 control plane for the Minekin managed Minecraft client"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "protobuf>=6.31.1,<7",
]

[project.scripts]
minekin = "minekin_core.__main__:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    # The `nodejs` extra pins the Node that runs the checker. Without it pyright
    # uses whatever node is on PATH and downloads one when there is none, so the
    # same source could be checked by a different runtime on every host.
    "pyright[nodejs]>=1.1.405,<2",
    "pytest>=8.4,<10",
    "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/minekin_core"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

# The generated package still ships `.pyi` stubs, so hand-written code gets real
# types for `Envelope`, `Capability` and friends. `ignore` only silences
# diagnostics *inside* protoc's own stubs, which use bare `Mapping` parameters
# and cannot satisfy strict mode. Do not drop the stubs to satisfy this entry.
[tool.pyright]
include = ["src", "tests", "tools"]
ignore = ["src/minekin_core/generated"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tools"]
# Generated modules carry a multi-kilobyte serialized descriptor on one line and
# dependency imports that exist only for descriptor registration.
extend-exclude = ["src/minekin_core/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Stated rather than inferred from the `src` roots above. Inference is not the same
# answer on Windows and Linux for this repository — the same import block is `I001`
# on one and clean on the other, measured both ways with the same ruff version — and
# a lint gate that reads differently on the machine that writes the code and the one
# that gates it is worse than no gate. The list is the modules this repository owns:
# the package under `src`, and the helpers the tests and tools import by bare name.
known-first-party = [
    "assert_case_evidence",
    "bridge_peer",
    "bundle_support",
    "check_case_assertions",
    "evidence_provenance",
    "fault_injection",
    "fault_support",
    "minekin_core",
    "session_support",
]

[tool.ruff.format]
quote-style = "double"
