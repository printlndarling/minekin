[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "minekin-core"
version = "0.0.0"
description = "P0 control plane for the Minekin managed Minecraft client"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "protobuf>=5.29,<7",
]

[project.scripts]
minekin = "minekin_core.__main__:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "pyright>=1.1.405,<2",
    "pytest>=8.4,<10",
    "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/minekin_core"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
