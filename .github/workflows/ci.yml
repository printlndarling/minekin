name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python tools/check_boundaries.py
      - run: uv run python tools/verify_fixture_digests.py
      - run: uv build --wheel
      - run: uv run python tools/check_wheel_boundary.py dist/*.whl
      - run: uv run minekin --help

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-action@v1.5.0
        with:
          setup_only: true
      - run: buf build --error-format=github-actions
      - run: buf lint --error-format=github-actions
      - run: buf format --diff --error-format=github-actions --exit-code

  bridge-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Verify pinned Bridge scaffold without downloading Minecraft
        run: uv run --no-project python tools/check_bridge_scaffold.py
