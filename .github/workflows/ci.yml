name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Every action is pinned to the commit its release tag pointed at, with the release
# kept beside it as a comment. A tag can be moved — by the upstream project, or by
# anyone who gets into it — and this repository digest-verifies everything else it
# fetches: the Gradle wrapper, the server jar, the Bridge jar, the buf CLI, the
# fixtures. An action is another way to run somebody else's code with this
# repository's credentials, so it is pinned the same way.
#
# Renewing one is the same deliberate act as renewing any other pin here: read the
# release's diff, resolve the tag, and change both the SHA and the comment in one
# reviewed commit. `tools/check_workflow_pins.py` refuses a workflow that is not
# pinned this way, and refuses a pin whose release comment is missing — a bare SHA
# nobody can trace back to a release is a pin nobody can review.
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      # The interpreter is part of this repository's pinned toolchain, because its
      # SQLite is. `connect_writer` refuses a runtime outside the validated WAL
      # safety set, and the runner's `/usr/bin/python3` links the distribution's
      # SQLite, which is older than that set — so the suite fails on the runner for
      # a reason that has nothing to do with the commit under test, while passing on
      # every machine whose `uv sync` made the venv from a managed interpreter.
      #
      # Both halves are needed: `only-managed` says where the interpreter comes from
      # (uv's builds carry their own SQLite; the distribution's does not), and the
      # version says which one — 3.12, which is what `target-version` and
      # `pythonVersion` already name for ruff and pyright.
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python tools/check_boundaries.py
      - run: uv run python tools/check_case_assertions.py
      - run: uv run python tools/verify_fixture_digests.py
      - run: uv run python tools/check_workflow_pins.py
      - run: uv build --wheel
      - run: uv run python tools/check_wheel_boundary.py dist/*.whl
      - run: uv run minekin --help

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
          # Pinning the action pins the action, not the CLI it downloads. Lint
          # rules and format output change between Buf releases, so an unpinned
          # CLI can turn this gate red without a change to this repository.
          #
          # No leading `v` here, and that is not a typo: the action builds the
          # download URL as `.../download/v${version}/...`, so `v1.50.0` asked for
          # a release named `vv1.50.0` and the job died on a 404 before `buf` ran.
          version: 1.50.0
          # From the release's own sha256.txt. The action downloads the plain
          # `buf-Linux-x86_64`, not the tarball, so this is that entry. Every
          # other artifact this repository fetches is digest-verified; the CLI
          # that gates the protocol should not be the exception.
          checksum: 154ea883ce098eac4fa106ff9ee4e4964bb97f809dd8ec9c34a432b466ce1494
      - run: buf build --error-format=github-actions
      - run: buf lint --error-format=github-actions
      - run: buf format --diff --error-format=github-actions --exit-code
      - name: Verify checked-in Python protobufs
        run: |
          python3 tools/generate_protos.py
          git diff --exit-code -- src/minekin_core/generated

  bridge-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Verify pinned Bridge scaffold without downloading Minecraft
        run: uv run --no-project python tools/check_bridge_scaffold.py
      - name: Refuse server state outside the Bridge's host adapter
        run: uv run --no-project python tools/check_bridge_host_boundary.py
      - name: Run the dependency-free Bridge protocol and adapter checks
        run: |
          javac -version
          uv run --no-project python tools/check_bridge_protocol.py
          uv run --no-project python tools/check_bridge_proto_java.py
